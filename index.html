<!DOCTYPE html>
<html>
<head>
    <title>Camera ASCII</title>
    <style>
    #camera {
        display: none;
    }
    #output {
        font-size: 8px;
        line-height: 8px;
        margin: 0;
    }
</style>
</head>

<body>

    <button id="start">Start Camera</button>

    <video id="camera" autoplay playsinline></video>

    <pre id="output"></pre>

    <script>
        const button = document.getElementById("start");
        const video = document.getElementById("camera");
        const output = document.getElementById("output");

        
     const colors = [
    // GRAYSCALE
    { rgb: [255, 255, 255], emoji: "⬜️" },
    { rgb: [235, 235, 235], emoji: "▫️" },
    { rgb: [215, 215, 215], emoji: "▫️" },
    { rgb: [190, 190, 190], emoji: "◻️" },
    { rgb: [165, 165, 165], emoji: "◼️" },
    { rgb: [140, 140, 140], emoji: "◼️" },
    { rgb: [115, 115, 115], emoji: "◼️" },
    { rgb: [90, 90, 90], emoji: "◼️" },
    { rgb: [65, 65, 65], emoji: "▪️" },
    { rgb: [35, 35, 35], emoji: "▪️" },
    { rgb: [0, 0, 0], emoji: "⬛️" },

    // RED
    { rgb: [255, 80, 80], emoji: "🟥" },
    { rgb: [255, 0, 0], emoji: "🔴" },
    { rgb: [220, 0, 0], emoji: "🔴" },
    { rgb: [180, 0, 0], emoji: "🔴" },
    { rgb: [140, 0, 0], emoji: "♦️" },

    // PINK
    { rgb: [255, 180, 200], emoji: "🌸" },
    { rgb: [255, 130, 170], emoji: "🌸" },
    { rgb: [255, 80, 140], emoji: "💗" },
    { rgb: [255, 0, 255], emoji: "💗" },

    // ORANGE
    { rgb: [255, 200, 100], emoji: "🟧" },
    { rgb: [255, 165, 0], emoji: "🟠" },
    { rgb: [255, 130, 0], emoji: "🟧" },
    { rgb: [255, 90, 0], emoji: "🟧" },
    { rgb: [210, 70, 0], emoji: "🟧" },

    // YELLOW
    { rgb: [255, 255, 180], emoji: "🟨" },
    { rgb: [255, 255, 0], emoji: "🟨" },
    { rgb: [255, 230, 0], emoji: "🟨" },
    { rgb: [255, 200, 0], emoji: "⭐" },
    { rgb: [220, 180, 0], emoji: "⭐" },

    // LIME
    { rgb: [220, 255, 100], emoji: "🟩" },
    { rgb: [180, 255, 50], emoji: "🟩" },
    { rgb: [130, 255, 0], emoji: "🟩" },

    // GREEN
    { rgb: [180, 255, 180], emoji: "🟩" },
    { rgb: [100, 255, 100], emoji: "🟩" },
    { rgb: [0, 255, 0], emoji: "🟩" },
    { rgb: [0, 200, 0], emoji: "🟢" },
    { rgb: [0, 160, 0], emoji: "🟩" },
    { rgb: [0, 128, 0], emoji: "🟩" },
    { rgb: [0, 90, 0], emoji: "🟩" },

    // TEAL
    { rgb: [150, 255, 220], emoji: "🟩" },
    { rgb: [0, 255, 180], emoji: "🟩" },
    { rgb: [0, 220, 180], emoji: "🟩" },
    { rgb: [0, 180, 160], emoji: "🟩" },

    // CYAN
    { rgb: [180, 255, 255], emoji: "🔹" },
    { rgb: [0, 255, 255], emoji: "🔹" },
    { rgb: [0, 220, 255], emoji: "🔹" },
    { rgb: [0, 190, 220], emoji: "🔹" },

    // LIGHT BLUE
    { rgb: [180, 220, 255], emoji: "🔵" },
    { rgb: [120, 190, 255], emoji: "🔵" },
    { rgb: [80, 160, 255], emoji: "🔵" },
    { rgb: [30, 144, 255], emoji: "🔵" },

    // BLUE
    { rgb: [0, 120, 255], emoji: "🟦" },
    { rgb: [0, 80, 255], emoji: "🟦" },
    { rgb: [0, 0, 255], emoji: "🟦" },
    { rgb: [0, 0, 200], emoji: "🔵" },
    { rgb: [0, 0, 150], emoji: "🔵" },
    { rgb: [0, 0, 100], emoji: "🟦" },

    // INDIGO
    { rgb: [100, 100, 255], emoji: "🟪" },
    { rgb: [70, 70, 200], emoji: "🟪" },
    { rgb: [50, 50, 150], emoji: "🟪" },

    // PURPLE
    { rgb: [220, 170, 255], emoji: "🟪" },
    { rgb: [190, 100, 255], emoji: "🟪" },
    { rgb: [150, 0, 255], emoji: "🟪" },
    { rgb: [128, 0, 128], emoji: "🟣" },
    { rgb: [100, 0, 180], emoji: "🟪" },
    { rgb: [60, 0, 100], emoji: "🟪" },

    // BROWN
    { rgb: [255, 220, 180], emoji: "🟫" },
    { rgb: [220, 170, 120], emoji: "🟫" },
    { rgb: [190, 130, 80], emoji: "🟫" },
    { rgb: [165, 42, 42], emoji: "🟫" },
    { rgb: [139, 69, 19], emoji: "🟫" },
    { rgb: [100, 55, 20], emoji: "🟫" },
    { rgb: [60, 30, 15], emoji: "🟫" }
];
        

        button.onclick = async () => {
            alert("Button works");
        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "environment"
            }
        });

            video.srcObject = stream;
            const track = stream.getVideoTracks()[0];

const capabilities = track.getCapabilities();

if (capabilities.torch) {
    await track.applyConstraints({
        advanced: [
            {
                torch: true
            }
        ]
    });
}

            const canvas = document.createElement("canvas");
            canvas.width = 80;
            canvas.height = 45;

            const ctx = canvas.getContext("2d");

       async function captureFrame() {
    ctx.drawImage(video, 0, 0, 80, 45);

    const image = ctx.getImageData(0, 0, 80, 45);

    let ascii = "";

    for (let i = 0; i < image.data.length; i += 4) {
        const r = image.data[i];
        const g = image.data[i + 1];
        const b = image.data[i + 2];

        let closestColor = colors[0];
        let closestDistance = Infinity;

        for (const color of colors) {
            const cr = color.rgb[0];
            const cg = color.rgb[1];
            const cb = color.rgb[2];

            const distance =
                (r - cr) ** 2 +
                (g - cg) ** 2 +
                (b - cb) ** 2;

            if (distance < closestDistance) {
                closestDistance = distance;
                closestColor = color;
            }
        }

        ascii += closestColor.emoji;

        if ((i / 4 + 1) % 80 === 0) {
            ascii += "\n";
        }
    }

    output.textContent = ascii;

    await fetch("/camera-frame", {
        method: "POST",
        headers: {
            "Content-Type": "text/plain"
        },
        body: ascii
    });
}

        setInterval(async () => {
    const response = await fetch("/camera-command");
    const command = await response.text();

    if (command === "CAPTURE") {
        captureFrame();
    }
}, 100);
        };
    </script>

</body>
</html>
