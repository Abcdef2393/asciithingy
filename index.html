<!DOCTYPE html>
<html>
<head>
    <title>Camera ASCII</title>
    <style>
    #camera {
        display: none;
    }
    #output {
        font-size: 8px;
        line-height: 8px;
        margin: 0;
    }
</style>
</head>

<body>

    <button id="start">Start Camera</button>

    <video id="camera" autoplay playsinline></video>

    <pre id="output"></pre>

    <script>
        const button = document.getElementById("start");
        const video = document.getElementById("camera");
        const output = document.getElementById("output");

        const colors = [
           { rgb: [0, 0, 0], emoji: "⬛️" },
{ rgb: [255, 255, 255], emoji: "⬜️" },
{ rgb: [255, 0, 0], emoji: "🟥" },
{ rgb: [0, 255, 0], emoji: "🟩" },
{ rgb: [0, 0, 255], emoji: "🟦" },
{ rgb: [255, 255, 0], emoji: "🟨" },
{ rgb: [255, 165, 0], emoji: "🟧" },
{ rgb: [128, 0, 128], emoji: "🟪" },
{ rgb: [165, 42, 42], emoji: "🟫" },
{ rgb: [255, 192, 203], emoji: "🩷" },
{ rgb: [0, 255, 255], emoji: "🩵" },
{ rgb: [128, 128, 128], emoji: "🩶" },
{ rgb: [0, 128, 0], emoji: "💚" },
{ rgb: [255, 20, 147], emoji: "💗" },
{ rgb: [255, 105, 180], emoji: "💖" },
{ rgb: [255, 215, 0], emoji: "🌟" },
{ rgb: [255, 140, 0], emoji: "🔥" },
{ rgb: [139, 69, 19], emoji: "🪵" },
{ rgb: [34, 139, 34], emoji: "🌲" },
{ rgb: [0, 191, 255], emoji: "🌊" },
{ rgb: [135, 206, 235], emoji: "☁️" },
{ rgb: [255, 228, 196], emoji: "🍑" },
{ rgb: [210, 180, 140], emoji: "🏜️" },
{ rgb: [75, 0, 130], emoji: "🔮" },
{ rgb: [238, 130, 238], emoji: "🌸" },
{ rgb: [255, 182, 193], emoji: "🌷" },
{ rgb: [173, 216, 230], emoji: "❄️" },
{ rgb: [144, 238, 144], emoji: "🍃" },
{ rgb: [255, 250, 205], emoji: "🌕" },
{ rgb: [64, 64, 64], emoji: "🌑" }
        ];

        button.onclick = async () => {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "environment"
            }
        });

            video.srcObject = stream;

            const canvas = document.createElement("canvas");
            canvas.width = 80;
            canvas.height = 45;

            const ctx = canvas.getContext("2d");

            setInterval(() => {
                ctx.drawImage(video, 0, 0, 80, 45);

                const image = ctx.getImageData(0, 0, 80, 45);

                let ascii = "";

                for (let i = 0; i < image.data.length; i += 4) {
                    const r = image.data[i];
                    const g = image.data[i + 1];
                    const b = image.data[i + 2];

                    let closestColor = colors[0];
                    let closestDistance = Infinity;

                    for (const color of colors) {
                        const cr = color.rgb[0];
                        const cg = color.rgb[1];
                        const cb = color.rgb[2];

                        const distance =
                            (r - cr) ** 2 +
                            (g - cg) ** 2 +
                            (b - cb) ** 2;

                        if (distance < closestDistance) {
                            closestDistance = distance;
                            closestColor = color;
                        }
                    }

                    ascii += closestColor.emoji;

                    if ((i / 4 + 1) % 80 === 0) {
                        ascii += "\n";
                    }
                }

                output.textContent = ascii;
            }, 200);
        };
    </script>

</body>
</html>
