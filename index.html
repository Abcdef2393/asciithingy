<!DOCTYPE html>
<html>
<head>
    <title>Camera ASCII</title>
    <style>
    #camera {
        display: none;
    }
    #output {
        font-size: 8px;
        line-height: 8px;
        margin: 0;
    }
</style>
</head>

<body>

    <button id="start">Start Camera</button>

    <video id="camera" autoplay playsinline></video>

    <pre id="output"></pre>

{ rgb: [101, 67, 33], emoji: "🍫" },
{ rgb: [80, 45, 20], emoji: "🧱" },
{ rgb: [60, 30, 15], emoji: "🪨" },

{ rgb: [255, 245, 238], emoji: "🤍" },
{ rgb: [255, 240, 200], emoji: "🌤️" },
{ rgb: [255, 235, 150], emoji: "☀️" },
{ rgb: [200, 240, 255], emoji: "🌨️" },
{ rgb: [180, 255, 220], emoji: "🌿" },
{ rgb: [220, 180, 255], emoji: "🌸" }
        ];

        button.onclick = async () => {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "environment"
            }
        });

            video.srcObject = stream;

            const canvas = document.createElement("canvas");
            canvas.width = 80;
            canvas.height = 45;

            const ctx = canvas.getContext("2d");

       async function captureFrame() {
    ctx.drawImage(video, 0, 0, 80, 45);

    const image = ctx.getImageData(0, 0, 80, 45);

    let ascii = "";

    for (let i = 0; i < image.data.length; i += 4) {
        const r = image.data[i];
        const g = image.data[i + 1];
        const b = image.data[i + 2];

        let closestColor = colors[0];
        let closestDistance = Infinity;

        for (const color of colors) {
            const cr = color.rgb[0];
            const cg = color.rgb[1];
            const cb = color.rgb[2];

            const distance =
                (r - cr) ** 2 +
                (g - cg) ** 2 +
                (b - cb) ** 2;

            if (distance < closestDistance) {
                closestDistance = distance;
                closestColor = color;
            }
        }

        ascii += closestColor.emoji;

        if ((i / 4 + 1) % 80 === 0) {
            ascii += "\n";
        }
    }

    output.textContent = ascii;

    await fetch("/camera-frame", {
        method: "POST",
        headers: {
            "Content-Type": "text/plain"
        },
        body: ascii
    });
}

        setInterval(async () => {
    const response = await fetch("/camera-command");
    const command = await response.text();

    if (command === "CAPTURE") {
        captureFrame();
    }
}, 100);
        };
    </script>
