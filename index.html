<!DOCTYPE html>
<html>
<head>
    <title>Camera ASCII</title>
    <style>
    #camera {
        display: none;
    }
    #output {
        font-size: 8px;
        line-height: 8px;
        margin: 0;
    }
</style>
</head>

<body>

    <button id="start">Start Camera</button>

    <video id="camera" autoplay playsinline></video>

    <pre id="output"></pre>

    <script>
        const button = document.getElementById("start");
        const video = document.getElementById("camera");
        const output = document.getElementById("output");

        const colors = [
     const colors = [
    // WHITE → BLACK
    { rgb: [255, 255, 255], emoji: "⬜️" },
    { rgb: [230, 230, 230], emoji: "▫️" },
    { rgb: [200, 200, 200], emoji: "▫️" },
    { rgb: [170, 170, 170], emoji: "🩶" },
    { rgb: [140, 140, 140], emoji: "🩶" },
    { rgb: [110, 110, 110], emoji: "◼️" },
    { rgb: [80, 80, 80], emoji: "◼️" },
    { rgb: [40, 40, 40], emoji: "◼️" },
    { rgb: [0, 0, 0], emoji: "⬛️" },

    // RED
    { rgb: [255, 50, 50], emoji: "🟥" },
    { rgb: [255, 0, 0], emoji: "❤️" },
    { rgb: [200, 0, 0], emoji: "🔴" },
    { rgb: [150, 0, 0], emoji: "🔴" },

    // ORANGE
    { rgb: [255, 180, 80], emoji: "🟧" },
    { rgb: [255, 140, 0], emoji: "🟧" },
    { rgb: [255, 100, 0], emoji: "🟧" },
    { rgb: [200, 70, 0], emoji: "🟧" },

    // YELLOW
    { rgb: [255, 255, 150], emoji: "🟨" },
    { rgb: [255, 255, 0], emoji: "🟨" },
    { rgb: [255, 220, 0], emoji: "🟨" },
    { rgb: [200, 180, 0], emoji: "🟨" },

    // GREEN
    { rgb: [180, 255, 180], emoji: "🟩" },
    { rgb: [100, 255, 100], emoji: "🟩" },
    { rgb: [0, 255, 0], emoji: "🟩" },
    { rgb: [0, 200, 0], emoji: "🟩" },
    { rgb: [0, 128, 0], emoji: "🟩" },
    { rgb: [0, 70, 0], emoji: "🟩" },

    // CYAN
    { rgb: [180, 255, 255], emoji: "🩵" },
    { rgb: [0, 255, 255], emoji: "🩵" },
    { rgb: [0, 200, 220], emoji: "🩵" },
    { rgb: [0, 140, 180], emoji: "🩵" },

    // BLUE
    { rgb: [150, 200, 255], emoji: "🟦" },
    { rgb: [50, 150, 255], emoji: "🟦" },
    { rgb: [0, 100, 255], emoji: "🟦" },
    { rgb: [0, 0, 255], emoji: "🟦" },
    { rgb: [0, 0, 180], emoji: "🟦" },
    { rgb: [0, 0, 100], emoji: "🟦" },

    // PURPLE
    { rgb: [220, 170, 255], emoji: "🟪" },
    { rgb: [180, 80, 255], emoji: "🟪" },
    { rgb: [150, 0, 255], emoji: "🟪" },
    { rgb: [100, 0, 180], emoji: "🟪" },
    { rgb: [60, 0, 100], emoji: "🟪" },

    // PINK
    { rgb: [255, 200, 220], emoji: "🩷" },
    { rgb: [255, 120, 180], emoji: "🩷" },
    { rgb: [255, 50, 150], emoji: "🩷" },
    { rgb: [255, 0, 255], emoji: "🩷" },

    // BROWN
    { rgb: [255, 220, 180], emoji: "🟫" },
    { rgb: [200, 150, 100], emoji: "🟫" },
    { rgb: [165, 42, 42], emoji: "🟫" },
    { rgb: [120, 70, 30], emoji: "🟫" },
    { rgb: [70, 40, 20], emoji: "🟫" }
];
        ];

        button.onclick = async () => {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "environment"
            }
        });

            video.srcObject = stream;

            const canvas = document.createElement("canvas");
            canvas.width = 80;
            canvas.height = 45;

            const ctx = canvas.getContext("2d");

       async function captureFrame() {
    ctx.drawImage(video, 0, 0, 80, 45);

    const image = ctx.getImageData(0, 0, 80, 45);

    let ascii = "";

    for (let i = 0; i < image.data.length; i += 4) {
        const r = image.data[i];
        const g = image.data[i + 1];
        const b = image.data[i + 2];

        let closestColor = colors[0];
        let closestDistance = Infinity;

        for (const color of colors) {
            const cr = color.rgb[0];
            const cg = color.rgb[1];
            const cb = color.rgb[2];

            const distance =
                (r - cr) ** 2 +
                (g - cg) ** 2 +
                (b - cb) ** 2;

            if (distance < closestDistance) {
                closestDistance = distance;
                closestColor = color;
            }
        }

        ascii += closestColor.emoji;

        if ((i / 4 + 1) % 80 === 0) {
            ascii += "\n";
        }
    }

    output.textContent = ascii;

    await fetch("/camera-frame", {
        method: "POST",
        headers: {
            "Content-Type": "text/plain"
        },
        body: ascii
    });
}

        setInterval(async () => {
    const response = await fetch("/camera-command");
    const command = await response.text();

    if (command === "CAPTURE") {
        captureFrame();
    }
}, 100);
        };
    </script>

</body>
</html>
