<!DOCTYPE html>
<html>
<head>
    <title>Camera ASCII</title>
    <style>
        /*
    #camera {
        display: none;
    }
        */
    #camera {
        width: 640px;
        display: block;
    } 
    #output {
        font-size: 4px;
        line-height: 4px;
        margin: 0;
    }
</style>
</head>

<body>

    <button id="start">Start Camera</button>

    <video id="camera" autoplay playsinline></video>

    <pre id="output"></pre>
    <button id="flashlight">Turn Flashlight On</button>

    <script>
        const flashlightButton = document.getElementById("flashlight");
        let flashlightOn = false;
        const button = document.getElementById("start");
        const video = document.getElementById("camera");
        const output = document.getElementById("output");

        
     const colors = [
// BASIC FULL-SIZE PIXELS
{ rgb: [255, 255, 255], emoji: "⬜️" },
{ rgb: [0, 0, 0], emoji: "⬛️" },

{ rgb: [255, 0, 0], emoji: "🟥" },
{ rgb: [255, 165, 0], emoji: "🟧" },
{ rgb: [255, 255, 0], emoji: "🟨" },
{ rgb: [0, 255, 0], emoji: "🟩" },
{ rgb: [0, 0, 255], emoji: "🟦" },
{ rgb: [150, 0, 255], emoji: "🟪" },
{ rgb: [165, 42, 42], emoji: "🟫" },
// EXTRA GRAYSCALE
{ rgb: [255, 255, 255], emoji: "⚪" },
{ rgb: [220, 220, 220], emoji: "⚪" },
{ rgb: [180, 180, 180], emoji: "🔳" },
{ rgb: [140, 140, 140], emoji: "🔲" },
{ rgb: [25, 25, 25], emoji: "⚫" },

// EXTRA RED
{ rgb: [255, 80, 80], emoji: "🍎" },
{ rgb: [220, 40, 40], emoji: "🍎" },
{ rgb: [180, 30, 30], emoji: "🧱" },
{ rgb: [140, 20, 20], emoji: "🧱" },
{ rgb: [255, 100, 50], emoji: "🎈" },

// EXTRA ORANGE
{ rgb: [255, 180, 80], emoji: "🍊" },
{ rgb: [255, 140, 40], emoji: "🍊" },
{ rgb: [230, 100, 20], emoji: "🎃" },
{ rgb: [200, 70, 10], emoji: "🥕" },

// EXTRA YELLOW
{ rgb: [255, 255, 120], emoji: "🌟" },
{ rgb: [255, 230, 50], emoji: "🌟" },
{ rgb: [255, 200, 20], emoji: "🌕" },
{ rgb: [240, 190, 0], emoji: "🌕" },
{ rgb: [255, 240, 100], emoji: "🍋" },

// EXTRA LIGHT GREEN
{ rgb: [200, 255, 150], emoji: "🍏" },
{ rgb: [150, 255, 100], emoji: "🥝" },
{ rgb: [100, 220, 50], emoji: "🥝" },
{ rgb: [50, 180, 50], emoji: "🥦" },

// EXTRA GREEN
{ rgb: [0, 255, 100], emoji: "🥦" },
{ rgb: [0, 220, 80], emoji: "🍏" },
{ rgb: [0, 180, 50], emoji: "🥬" },
{ rgb: [0, 130, 40], emoji: "🌲" },
{ rgb: [0, 90, 20], emoji: "🌳" },

// EXTRA CYAN / TEAL
{ rgb: [150, 255, 255], emoji: "🌊" },
{ rgb: [50, 240, 240], emoji: "🌊" },
{ rgb: [0, 200, 200], emoji: "🌊" },
{ rgb: [0, 160, 170], emoji: "💧" },
{ rgb: [0, 120, 140], emoji: "💧" },

// EXTRA LIGHT BLUE
{ rgb: [180, 220, 255], emoji: "☁️" },
{ rgb: [130, 200, 255], emoji: "💎" },
{ rgb: [80, 170, 255], emoji: "💎" },
{ rgb: [50, 140, 230], emoji: "💎" },

// EXTRA BLUE
{ rgb: [30, 120, 255], emoji: "🔵" },
{ rgb: [20, 80, 220], emoji: "🌐" },
{ rgb: [0, 60, 180], emoji: "🌎" },
{ rgb: [0, 30, 120], emoji: "🌎" },

// EXTRA PURPLE
{ rgb: [220, 150, 255], emoji: "🔮" },
{ rgb: [180, 70, 255], emoji: "🔮" },
{ rgb: [140, 40, 220], emoji: "🟣" },
{ rgb: [100, 20, 160], emoji: "🟣" },

// EXTRA BROWN
{ rgb: [220, 170, 110], emoji: "🥜" },
{ rgb: [190, 130, 70], emoji: "🥜" },
{ rgb: [150, 90, 40], emoji: "🧱" },

// EXTRA NATURAL COLORS
{ rgb: [255, 230, 180], emoji: "🏖️" },
{ rgb: [220, 190, 140], emoji: "🏜️" },

// EXTRA SPECIAL FULL-SIZE COLORS
{ rgb: [255, 255, 255], emoji: "☁️" },
{ rgb: [200, 240, 255], emoji: "❄️" },
{ rgb: [255, 150, 50], emoji: "🔥" },
{ rgb: [255, 220, 50], emoji: "⭐" },
{ rgb: [100, 200, 255], emoji: "💎" }
];
        

        button.onclick = async () => {
            alert("Button works");
            
            const stream = await navigator.mediaDevices.getDisplayMedia({
                video: true
            });
            
         /*   
        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "environment"
            }
        });
  */

            video.srcObject = stream;
            const track = stream.getVideoTracks()[0];

flashlightButton.onclick = async () => {
    const capabilities = track.getCapabilities();

    if (!capabilities.torch) {
        alert("Flashlight is not supported");
        return;
    }

    flashlightOn = !flashlightOn;

    await track.applyConstraints({
        advanced: [
            {
                torch: flashlightOn
            }
        ]
    });

    flashlightButton.textContent =
        flashlightOn ? "Turn Flashlight Off" : "Turn Flashlight On";
};

            const canvas = document.createElement("canvas");
            canvas.width = 160;
            canvas.height = 90;

            const ctx = canvas.getContext("2d");

       async function captureFrame() {
    ctx.drawImage(video, 0, 0, 160, 90);

    const image = ctx.getImageData(0, 0, 160, 90);

    let ascii = "";

    for (let i = 0; i < image.data.length; i += 4) {
        const r = image.data[i];
        const g = image.data[i + 1];
        const b = image.data[i + 2];

        let closestColor = colors[0];
        let closestDistance = Infinity;

        for (const color of colors) {
            const cr = color.rgb[0];
            const cg = color.rgb[1];
            const cb = color.rgb[2];

            const distance =
                (r - cr) ** 2 +
                (g - cg) ** 2 +
                (b - cb) ** 2;

            if (distance < closestDistance) {
                closestDistance = distance;
                closestColor = color;
            }
        }

        ascii += closestColor.emoji;

        if ((i / 4 + 1) % 160 === 0) {
            ascii += "\n";
        }
    }

    output.textContent = ascii;

    await fetch("/camera-frame", {
        method: "POST",
        headers: {
            "Content-Type": "text/plain"
        },
        body: ascii
    });
}

        setInterval(async () => {
    const response = await fetch("/camera-command");
    const command = await response.text();

    if (command === "CAPTURE") {
        await captureFrame();
    }
}, 100);
        };
    </script>

</body>
</html>
